[package]
name = "zksync-revm"
version = "0.1.0"
edition = "2024"

[dependencies]
revm = { version = "=33.1.0", features = [
    "std",
    "serde",
    "memory_limit",
    "optional_eip3607",
    "optional_block_gas_limit",
    "optional_no_base_fee",
    "optional_balance_check",
    "arbitrary",
    "c-kzg",
    "blst",
] }
auto_impl = "1.3.0"
serde = { version = "1", features = ["derive"] }
alloy-primitives = { version = "1.4.1", features = [
    "getrandom",
    "rand",
    "map-fxhash",
    "map-foldhash",
] }
# alloy-evm = { path = "../alloy-evm/crates/evm"}
alloy-evm = "0.25.1"
alloy-sol-types = "1.4.1"
tracing = "0.1"

[dev-dependencies]
serde_derive = "1.0"

